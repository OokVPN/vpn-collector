name: Update VPN

on:
  workflow_dispatch:

  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4

        with:
          node-version: 22

          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install Xray
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y unzip curl

          XRAY_VERSION="v26.3.27"

          curl -fL \
            "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/Xray-linux-64.zip" \
            -o /tmp/xray.zip

          rm -rf /tmp/xray

          mkdir -p /tmp/xray

          unzip -o \
            /tmp/xray.zip \
            -d /tmp/xray

          sudo install \
            -m 755 \
            /tmp/xray/xray \
            /usr/local/bin/xray

          xray version

      - name: Collect configs
        run: npm run collect

      - name: Calculate batch
        id: batch
        run: |
          set -e

          BATCH_SIZE=200

          TOTAL=$(node -e '
          const fs = require("fs");

          const a = JSON.parse(
            fs.readFileSync(
              "data/raw.json",
              "utf8"
            )
          );

          const s = new Set();

          for (const uri of a) {
            if (typeof uri !== "string") {
              continue;
            }

            try {
              const p =
                uri
                  .split("://", 1)[0]
                  .toLowerCase();

              if (p === "vmess") {
                let value =
                  uri.slice(8)
                    .replace(/-/g, "+")
                    .replace(/_/g, "/");

                value += "=".repeat(
                  (4 - value.length % 4) % 4
                );

                const data =
                  JSON.parse(
                    Buffer
                      .from(value, "base64")
                      .toString("utf8")
                  );

                if (!data.add || !data.port) {
                  continue;
                }

                s.add(
                  `${p}:${data.add}:${data.port}`
                );

                continue;
              }

              const u =
                new URL(uri);

              if (!u.hostname) {
                continue;
              }

              const port =
                Number(
                  u.port ||
                  (
                    p === "ss" ||
                    p === "socks" ||
                    p === "socks5"
                      ? 1080
                      : 443
                  )
                );

              s.add(
                `${p}:${u.hostname}:${port}`
              );
            } catch {}
          }

          console.log(s.size);
          ')

          if [ "$TOTAL" -eq 0 ]; then
            echo "No nodes found"
            exit 1
          fi

          BATCH_COUNT=$(
            ((TOTAL + BATCH_SIZE - 1) / BATCH_SIZE)
          )

          CURRENT=$(
            $(git rev-list --count HEAD) % BATCH_COUNT
          )

          echo "batch_index=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "batch_count=$BATCH_COUNT" >> "$GITHUB_OUTPUT"

          echo "Total unique: $TOTAL"
          echo "Batch: $((CURRENT + 1))/$BATCH_COUNT"

      - name: Hard server check
        run: npm run check

        env:
          BATCH_SIZE: 200
          BATCH_INDEX: ${{ steps.batch.outputs.batch_index }}

          MAX_LATENCY: 150

          TCP_TIMEOUT: 5000
          HTTP_TIMEOUT: 7000

          CONCURRENCY: 200
          XRAY_CONCURRENCY: 20

      - name: Generate subscription
        run: npm run generate

      - name: Validate subscription
        run: |
          set -e

          node - <<'NODE'
          const fs = require("fs");

          const file =
            "public/subscription.json";

          const data =
            JSON.parse(
              fs.readFileSync(
                file,
                "utf8"
              )
            );

          if (!Array.isArray(data)) {
            throw new Error(
              "Subscription is not an array"
            );
          }

          if (
            !data.length ||
            data[0]?.remarks !== "🇪🇺 АВТО ⚡"
          ) {
            throw new Error(
              "AUTO must be the first profile"
            );
          }

          const auto =
            data[0];

          if (
            !Array.isArray(
              auto.outbounds
            )
          ) {
            throw new Error(
              "AUTO outbounds missing"
            );
          }

          console.log(
            `Subscription profiles: ${data.length}`
          );

          console.log(
            `AUTO nodes: ${auto.outbounds.length}`
          );
          NODE

      - name: Commit results
        run: |
          set -e

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/ \
            public/subscription.json

          if git diff --cached --quiet; then
            echo "Nothing changed"
          else
            git commit \
              -m "Update VPN servers"

            git push
          fi
