name: Update VPN Subscription

on:
  workflow_dispatch:
  schedule:
    - cron: '*/14 * * * *'

concurrency:
  group: update-subscription
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Xray
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          URL=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/XTLS/Xray-core/releases/latest \
            | jq -r '.assets[] | select(.name == "Xray-linux-64.zip") | .browser_download_url')

          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "::error::Failed to resolve Xray-linux-64.zip download URL"
            exit 1
          fi

          curl -fL "$URL" -o xray.zip
          mkdir -p xray-bin
          unzip -o xray.zip -d xray-bin
          chmod +x xray-bin/xray
          xray-bin/xray version
          echo "XRAY_BIN=$(pwd)/xray-bin/xray" >> "$GITHUB_ENV"

      - name: Check and refresh nodes
        env:
          SOURCE_URLS: ${{ secrets.SOURCE_URLS }}
        run: npm run check

      - name: Generate subscription
        run: npm run generate

      - name: Validate output
        run: npm run validate

      - name: Commit and push
        run: |
          git config user.name "vpn-collector-bot"
          git config user.email "actions@users.noreply.github.com"

          git add \
            data/raw.json \
            data/checked.json \
            data/failed.json \
            data/geoip-cache.json \
            data/nodes.json \
            data/subscription.json \
            public/subscription.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update subscription [skip ci]"
            git pull --rebase --autostash
            git push
          fi
