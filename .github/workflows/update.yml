name: Update VPN

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Xray
        run: |
          set -e

          XRAY_VERSION="v26.3.27"

          curl -fL \
            "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/Xray-linux-64.zip" \
            -o /tmp/xray.zip

          unzip -o /tmp/xray.zip -d /tmp/xray

          sudo install -m 755 \
            /tmp/xray/xray \
            /usr/local/bin/xray

          xray version

      - name: Collect configs
        run: npm run collect

      - name: TCP check
        run: npm run check
        env:
          MAX_LATENCY: 150
          TCP_TIMEOUT: 5000
          CONCURRENCY: 200

      - name: Generate subscription
        run: npm run generate

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/ public/subscription.json

          if git diff --cached --quiet; then
            echo "Nothing changed"
          else
            git commit -m "Update VPN servers"
            git push
          fi
