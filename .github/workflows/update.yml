name: Update VPN

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Xray
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y unzip curl

          XRAY_VERSION="v26.3.27"

          curl -fL \
            "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/Xray-linux-64.zip" \
            -o /tmp/xray.zip

          rm -rf /tmp/xray
          mkdir -p /tmp/xray

          unzip -o \
            /tmp/xray.zip \
            -d /tmp/xray

          sudo install \
            -m 755 \
            /tmp/xray/xray \
            /usr/local/bin/xray

          xray version

      - name: Collect configs
        run: npm run collect

      - name: Check servers
        run: npm run check
        env:
          TARGET_NODES: 200
          CHECK_BATCH_SIZE: 200

          MAX_LATENCY: 150
          TCP_TIMEOUT: 5000
          XRAY_TIMEOUT: 10000
          CURL_TIMEOUT: 7000

          CONCURRENCY: 100
          XRAY_CONCURRENCY: 10

      - name: Generate subscription
        run: npm run generate

      - name: Validate subscription
        run: |
          set -e

          node - <<'NODE'
          const fs = require("fs");

          const file =
            "public/subscription.json";

          const data =
            JSON.parse(
              fs.readFileSync(
                file,
                "utf8"
              )
            );

          if (!Array.isArray(data)) {
            throw new Error(
              "Subscription is not an array"
            );
          }

          if (
            !data.length ||
            data[0]?.remarks !== "🇪🇺 АВТО ⚡"
          ) {
            throw new Error(
              "AUTO must be the first profile"
            );
          }

          const auto = data[0];

          if (
            !Array.isArray(
              auto.outbounds
            )
          ) {
            throw new Error(
              "AUTO outbounds missing"
            );
          }

          if (
            auto.outbounds.length === 0
          ) {
            throw new Error(
              "AUTO has no working nodes"
            );
          }

          console.log(
            `Subscription profiles: ${data.length}`
          );

          console.log(
            `AUTO nodes: ${auto.outbounds.length}`
          );
          NODE

      - name: Commit results
        run: |
          set -e

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/ \
            public/subscription.json

          if git diff --cached --quiet; then
            echo "Nothing changed"
          else
            git commit \
              -m "Update VPN servers"

            git push
          fi
