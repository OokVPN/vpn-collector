name: Update VPN

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Xray
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y unzip

          XRAY_VERSION="v26.3.27"

          curl -fL \
            "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/Xray-linux-64.zip" \
            -o /tmp/xray.zip

          unzip -o /tmp/xray.zip -d /tmp/xray

          sudo install -m 755 \
            /tmp/xray/xray \
            /usr/local/bin/xray

          xray version

      - name: Collect configs
        run: npm run collect

      - name: Calculate batch
        id: batch
        run: |
          BATCH_SIZE=200
          TOTAL=$(node -e '
          const fs=require("fs");
          const a=JSON.parse(fs.readFileSync("data/raw.json","utf8"));
          const s=new Set();

          for(const uri of a){
            if(typeof uri!=="string") continue;

            try{
              const u=new URL(uri);
              if(!u.hostname || !u.port) continue;

              const p=uri.split("://",1)[0].toLowerCase();
              s.add(`${p}:${u.hostname}:${u.port}`);
            }catch{}
          }

          console.log(s.size);
          ')

          BATCH_COUNT=$(( (TOTAL + BATCH_SIZE - 1) / BATCH_SIZE ))

          CURRENT=$((
            $(git rev-list --count HEAD) % BATCH_COUNT
          ))

          echo "batch_index=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "batch_count=$BATCH_COUNT" >> "$GITHUB_OUTPUT"

          echo "Total unique: $TOTAL"
          echo "Batch: $((CURRENT + 1))/$BATCH_COUNT"

      - name: TCP + Internet check
        run: npm run check
        env:
          BATCH_SIZE: 200
          BATCH_INDEX: ${{ steps.batch.outputs.batch_index }}
          MAX_LATENCY: 150
          TCP_TIMEOUT: 5000
          HTTP_TIMEOUT: 7000
          CONCURRENCY: 200
          HY2_CONCURRENCY: 20

      - name: Generate subscription
        run: npm run generate

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/ public/subscription.json

          if git diff --cached --quiet; then
            echo "Nothing changed"
          else
            git commit -m "Update VPN servers"
            git push
          fi
